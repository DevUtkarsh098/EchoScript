---
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: not ansible_check_mode
- name: Restart Jenkins controller
  ansible.builtin.systemd_service:
    name: echoscript-jenkins
    state: restarted
    daemon_reload: true
- name: Restart Jenkins agent
  ansible.builtin.systemd_service:
    name: echoscript-jenkins-agent
    state: "{{ 'restarted' if (jenkins_agent_start | default(false) | bool) else 'stopped' }}"
    daemon_reload: true

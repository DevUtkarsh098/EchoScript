---
- name: Require approved AWS target and a disposable-host test before production
  ansible.builtin.assert:
    that:
      - jenkins_host_approval_reference | length >= 10
      - ansible_connection == 'amazon.aws.aws_ssm'
      - jenkins_host_account_id == '598391748654'
      - jenkins_host_region == 'us-west-2'
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - jenkins_host_role in ['disposable', 'controller', 'validation', 'release']
      - jenkins_host_role == 'disposable' or jenkins_host_disposable_checks_passed | bool
    fail_msg: Approve the AWS target and pass disposable-host checks before configuring production Jenkins hosts.

- name: Use HTTPS for Ubuntu package downloads
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: 'http://(?:[a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu/?'
    replace: https://archive.ubuntu.com/ubuntu/

- name: Use HTTPS for Ubuntu security updates
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: 'http://security\.ubuntu\.com/ubuntu/?'
    replace: https://security.ubuntu.com/ubuntu/

- name: Install Docker and host maintenance tools from Ubuntu packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - docker.io
      - docker-compose-v2
      - openssl
      - jq
      - python3
      - unzip
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download the official AWS CLI v2 installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: '0644'

- name: Extract the official AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install
  when: not ansible_check_mode

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin
    creates: /usr/local/bin/aws
  when: not ansible_check_mode

- name: Keep Docker available on the dedicated Jenkins host
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Configure Docker daemon logging before restart
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: '{"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}'
  notify: Restart Docker

- name: Configure Jenkins controller runtime
  ansible.builtin.import_tasks: controller.yml
  when: jenkins_host_role == 'controller'

- name: Configure isolated inbound agent runtime
  ansible.builtin.import_tasks: agent.yml
  when: jenkins_host_role in ['validation', 'release']

- name: Apply pending Docker configuration
  ansible.builtin.meta: flush_handlers

- name: Create root-owned configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - /etc/echoscript
    - /etc/echoscript/aws

- name: Install non-secret host policy metadata
  ansible.builtin.template:
    src: host-policy.json.j2
    dest: /etc/echoscript/host-policy.json
    owner: root
    group: root
    mode: '0640'

- name: Install fixed machine role profiles only on the trusted release host
  ansible.builtin.template:
    src: aws-config.j2
    dest: /etc/echoscript/aws/config
    owner: root
    group: root
    mode: '0644'
  when: jenkins_host_role == 'release'

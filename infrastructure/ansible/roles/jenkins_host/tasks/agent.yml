---
- name: Gather existing service states without changing agent runtime
  ansible.builtin.service_facts:

- name: Preserve agent runtime state during configuration
  ansible.builtin.set_fact:
    jenkins_host_agent_was_active: >-
      {{ (ansible_facts.services.get('echoscript-jenkins-agent.service', {}).state | default('stopped')) == 'running' }}

- name: Create isolated agent account
  ansible.builtin.user:
    name: jenkins-agent
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/echoscript-agent
    create_home: false

- name: Create agent runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jenkins-agent
    group: jenkins-agent
    mode: '0750'
  loop:
    - /opt/echoscript-agent

- name: Grant the agent container access to its workspace
  ansible.builtin.file:
    path: /var/lib/echoscript-agent
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0750'

- name: Read role-specific inbound agent secret
  ansible.builtin.command:
    argv:
      - aws
      - secretsmanager
      - get-secret-value
      - --secret-id
      - "{{ jenkins_host_secret_id }}"
      - --region
      - "{{ jenkins_host_region }}"
      - --query
      - SecretString
      - --output
      - text
  register: jenkins_host_agent_bootstrap_raw
  changed_when: false
  no_log: true

- name: Validate inbound agent secret and CA trust
  ansible.builtin.assert:
    that:
      - (jenkins_host_agent_bootstrap_raw.stdout | from_json).agent_secret is defined
      - (jenkins_host_agent_bootstrap_raw.stdout | from_json).agent_secret is match('^[A-Za-z0-9_-]{32,}$')
      - (jenkins_host_agent_bootstrap_raw.stdout | from_json).controller_ca_pem is defined
      - (jenkins_host_agent_bootstrap_raw.stdout | from_json).controller_ca_pem is search('BEGIN CERTIFICATE')
    fail_msg: Populate this agent's secret with its own node token and public controller CA.
  no_log: true

- name: Require production smoke fixtures only on the isolated release host
  ansible.builtin.assert:
    that:
      - (jenkins_host_agent_bootstrap_raw.stdout | from_json).smoke_token is match('^[A-Za-z0-9_.-]{16,}$')
      - (jenkins_host_agent_bootstrap_raw.stdout | from_json).smoke_audio_base64 is match('^[A-Za-z0-9+/]+={0,2}$')
    fail_msg: The release agent Secrets Manager payload must include smoke_token and base64 smoke_audio_base64.
  when: jenkins_host_role == 'release'
  no_log: true

- name: Create release-only smoke fixture directory
  ansible.builtin.file:
    path: /etc/echoscript/jenkins/secrets
    state: directory
    owner: root
    group: '1000'
    mode: '0750'
  when: jenkins_host_role == 'release'

- name: Install release-only smoke authentication token
  ansible.builtin.copy:
    dest: /etc/echoscript/jenkins/secrets/smoke-token
    content: "{{ (jenkins_host_agent_bootstrap_raw.stdout | from_json).smoke_token }}\n"
    owner: root
    group: '1000'
    mode: '0440'
  when: jenkins_host_role == 'release'
  no_log: true

- name: Stage encrypted-host release-only smoke audio payload
  ansible.builtin.copy:
    dest: /etc/echoscript/jenkins/secrets/smoke-audio.base64
    content: "{{ (jenkins_host_agent_bootstrap_raw.stdout | from_json).smoke_audio_base64 }}"
    owner: root
    group: root
    mode: '0600'
  when: jenkins_host_role == 'release'
  no_log: true

- name: Decode release-only smoke audio fixture
  ansible.builtin.command:
    argv:
      - base64
      - --decode
      - --input
      - /etc/echoscript/jenkins/secrets/smoke-audio.base64
      - --output
      - /etc/echoscript/jenkins/secrets/smoke-audio
  register: jenkins_host_smoke_audio_decode
  changed_when: jenkins_host_smoke_audio_decode.rc == 0
  when: jenkins_host_role == 'release'
  no_log: true

- name: Set release fixture access for the isolated Jenkins agent container
  ansible.builtin.file:
    path: /etc/echoscript/jenkins/secrets/smoke-audio
    owner: root
    group: '1000'
    mode: '0440'
  when: jenkins_host_role == 'release'

- name: Remove temporary encoded smoke fixture
  ansible.builtin.file:
    path: /etc/echoscript/jenkins/secrets/smoke-audio.base64
    state: absent
  when: jenkins_host_role == 'release'

- name: Ensure agent configuration directory exists before installing controller CA
  ansible.builtin.file:
    path: /etc/echoscript/jenkins
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Install public Jenkins CA certificate for verified HTTPS
  ansible.builtin.copy:
    dest: /etc/echoscript/jenkins/jenkins-ca.crt
    content: "{{ (jenkins_host_agent_bootstrap_raw.stdout | from_json).controller_ca_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Require resolved private controller address
  ansible.builtin.assert:
    that:
      - jenkins_host_controller_private_ip is match('^10\\.63\\.0\\.[0-9]{1,3}$')
    fail_msg: Pass the controller private IP from the Jenkins Terraform output.

- name: Map private controller hostname on agent
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*\sjenkins\.internal$'
    line: "{{ jenkins_host_controller_private_ip }} jenkins.internal"
    state: present

- name: Install scoped AppArmor policy for rootless validation BuildKit
  ansible.builtin.copy:
    src: echoscript-buildkit-rootless.apparmor
    dest: /etc/apparmor.d/echoscript-buildkit-rootless
    owner: root
    group: root
    mode: '0644'
  register: jenkins_host_buildkit_apparmor_policy
  when: jenkins_host_role == 'validation'

- name: Load scoped AppArmor policy for rootless validation BuildKit
  ansible.builtin.command:
    argv:
      - apparmor_parser
      - -r
      - /etc/apparmor.d/echoscript-buildkit-rootless
  changed_when: true
  when:
    - jenkins_host_role == 'validation'
    - jenkins_host_buildkit_apparmor_policy.changed
    - not ansible_check_mode

- name: Install isolated agent runtime environment
  ansible.builtin.copy:
    dest: /etc/echoscript/jenkins/agent.env
    content: "JENKINS_AGENT_SECRET={{ (jenkins_host_agent_bootstrap_raw.stdout | from_json).agent_secret }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install pinned agent runtime image composition
  ansible.builtin.template:
    src: agent-compose.yml.j2
    dest: /opt/echoscript-agent/compose.yml
    owner: root
    group: root
    mode: '0640'
  notify: Restart Jenkins agent

- name: Install EC2-role ECR authentication helper for private CI image pulls
  ansible.builtin.template:
    src: agent-ecr-auth.sh.j2
    dest: /usr/local/sbin/echoscript-jenkins-agent-ecr-auth
    owner: root
    group: root
    mode: '0750'
  notify: Restart Jenkins agent

- name: Install agent systemd service
  ansible.builtin.template:
    src: jenkins-agent.service.j2
    dest: /etc/systemd/system/echoscript-jenkins-agent.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Jenkins agent

- name: Keep agents stopped unless the deployment operator explicitly starts them
  ansible.builtin.systemd_service:
    name: echoscript-jenkins-agent
    enabled: false
    state: "{{ 'started' if (jenkins_agent_start | default(false) | bool) else 'stopped' }}"
    daemon_reload: true

- name: Check agent controller TLS endpoint
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --cacert
      - /etc/echoscript/jenkins/jenkins-ca.crt
      - https://jenkins.internal:8443/login
  changed_when: false

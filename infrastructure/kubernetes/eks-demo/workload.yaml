apiVersion: v1
kind: Namespace
metadata:
  name: echoscript-demo
  labels:
    app.kubernetes.io/part-of: echoscript
    purpose: professor-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echoscript-demo-page
  namespace: echoscript-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>EchoScript on Kubernetes</title>
        <style>
          body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a2a; color: #f5f7fb; font: 18px system-ui, sans-serif; }
          main { max-width: 680px; padding: 3rem; border: 1px solid #34445e; border-radius: 18px; background: #18263a; }
          h1 { color: #79d4d5; }
          code { color: #b2e3ff; }
        </style>
      </head>
      <body>
        <main>
          <h1>EchoScript is running on Kubernetes</h1>
          <p>This demo workload is hosted on Amazon EKS in AWS.</p>
          <p>Kubernetes manages two web pods behind one Service.</p>
          <p>Project: <code>EchoScript</code> · Namespace: <code>echoscript-demo</code></p>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoscript-demo
  namespace: echoscript-demo
  labels:
    app.kubernetes.io/name: echoscript-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: echoscript-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echoscript-demo
    spec:
      containers:
        - name: web
          image: nginx:1.30.6-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: echoscript-demo-page
---
apiVersion: v1
kind: Service
metadata:
  name: echoscript-demo
  namespace: echoscript-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: echoscript-demo
  ports:
    - name: http
      port: 80
      targetPort: http

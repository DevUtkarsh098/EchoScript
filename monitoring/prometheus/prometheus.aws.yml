global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/aws.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: echoscript-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["ec-4762c5d9c1fa4c50a19bed3b76373799.ecs.us-west-2.on.aws:443"]
        labels:
          application: echoscript
          environment: aws

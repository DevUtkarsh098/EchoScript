services:
  ingest-service:
    build: ./services/ingest-service
    environment:
      APP_ENV: local
      MOCK_AUTH: "true"
      MOCK_PROCESSING: "true"
      MOCK_VIDEO: "true"
      PUBLIC_API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MOCK_AUTH: ${MOCK_AUTH:-true}
        VITE_APP_ENV: ${APP_ENV:-local}
        VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
        VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
        VITE_COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:-http://localhost:5173/auth/callback}
        VITE_COGNITO_SCOPE: ${COGNITO_SCOPE:-openid email profile}
    ports:
      - "5173:80"
    depends_on:
      ingest-service:
        condition: service_healthy


  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      ingest-service:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.35.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - mailpit

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-echoscript-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - alertmanager

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

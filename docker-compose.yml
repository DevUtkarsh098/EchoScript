services:
  ingest-service:
    build: ./services/ingest-service
    environment:
      APP_ENV: local
      MOCK_AUTH: "true"
      MOCK_PROCESSING: "true"
      MOCK_VIDEO: "true"
      PUBLIC_API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MOCK_AUTH: ${MOCK_AUTH:-true}
        VITE_APP_ENV: ${APP_ENV:-local}
        VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
        VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
        VITE_COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:-http://localhost:5173/auth/callback}
        VITE_COGNITO_SCOPE: ${COGNITO_SCOPE:-openid email profile}
    ports:
      - "5173:80"
    depends_on:
      ingest-service:
        condition: service_healthy

